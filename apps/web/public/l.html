<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Momo live view</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/live.css">
<script src="/l.js" defer></script>
</head>
<body>
<main class="live">
  <p id="reason">Connecting to Momo's browser…</p>
  <img id="shot" alt="The page Momo is working on" hidden>
  <div class="row"><input id="t" placeholder="Type here" autocomplete="off"><button id="send" class="quiet">Send</button><button id="enter" class="quiet">Enter</button></div>
  <div class="row"><button id="up" class="quiet">Scroll up</button><button id="down" class="quiet">Scroll down</button></div>
  <button id="done">I'm done</button>
</main>
</body>
</html>
